# docker-compose.prod.yml — Production-like full TypeScript stack
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#
# Required environment variables (via .env file or shell):
#   JWT_SECRET, OPENROUTER_API_KEY, POLYGON_API_KEY

services:
  # ── NestJS API ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:finsentinel@postgres:5432/finsentinel
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_MODEL=${AI_MODEL:-google/gemini-3-flash-preview}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - APP_TRADING_DEFAULT_MODE=${APP_TRADING_DEFAULT_MODE:-PAPER}
      - APP_AGENT_PERSONA=${APP_AGENT_PERSONA:-default}
      - APP_CRYPTO_NEWS_ENABLED=${APP_CRYPTO_NEWS_ENABLED:-false}
      - APP_TWITTER_6551_ENABLED=${APP_TWITTER_6551_ENABLED:-false}
      - APP_OKX_ENABLED=${APP_OKX_ENABLED:-false}
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Next.js Web ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: finsentinel
      POSTGRES_DB: finsentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
