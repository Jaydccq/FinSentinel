[package]
name = "finsentinel-desktop"
version = "0.1.0"
description = "FinSentinel desktop shell"
authors = ["FinSentinel"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finsentinel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
pdf-extract = "0.10"
text-splitter = { version = "0.29", features = ["tiktoken-rs"] }
tiktoken-rs = "0.9"
fastembed = "5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
