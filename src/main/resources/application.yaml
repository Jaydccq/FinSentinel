spring:
  application:
    name: finsentinel

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finsentinel}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: ${AI_MODEL:google/gemini-3-flash-preview}
          temperature: 0.3
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  storage:
    provider: ${APP_STORAGE_PROVIDER:rustfs}
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${APP_STORAGE_BUCKET:finsentinel}
    region: ${APP_STORAGE_REGION:us-east-1}

  google-drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    application-name: FinSentinel
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}

  firecrawl:
    api-key: ${FIRECRAWL_API_KEY:}
    base-url: https://api.firecrawl.dev/v2

  polygon:
    api-key: ${POLYGON_API_KEY}
    base-url: https://api.polygon.io

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  rag:
    chunk:
      chunk-size: 500
      chunk-overlap: 50
      min-chunk-size-chars: 200
      max-num-chunks: 10000

  archival:
    enabled: ${APP_ARCHIVAL_ENABLED:false}
    retention-days: ${APP_ARCHIVAL_RETENTION_DAYS:7}
    failed-retention-days: ${APP_ARCHIVAL_FAILED_RETENTION_DAYS:3}
    cron: ${APP_ARCHIVAL_CRON:0 0 2 * * *}
    batch-size: ${APP_ARCHIVAL_BATCH_SIZE:50}

  news:
    enabled: ${APP_NEWS_ENABLED:true}
    poll-interval: ${APP_NEWS_POLL_INTERVAL:60000}
    rss-poll-interval: ${APP_NEWS_RSS_POLL_INTERVAL:120000}
    watch-tickers:
      - AAPL
      - MSFT
      - GOOGL
      - TSLA
      - JPM
      - NVDA
    rss-feeds:
      - name: CNBC Top News
        url: https://www.cnbc.com/id/100003114/device/rss/rss.html
        source: RSS_CNBC
      - name: Yahoo Finance
        url: https://finance.yahoo.com/news/rssindex
        source: RSS_YAHOO
    retention-days: 30
    enrich:
      enabled: ${APP_NEWS_ENRICH_ENABLED:true}
      batch-size: 5

  compliance:
    region: US
    disclaimer: "This is AI-generated analysis for informational purposes only. It does not constitute investment advice. Past performance does not guarantee future results. Consult a licensed financial advisor before making investment decisions."
    forbidden-phrases:
      - "you should buy"
      - "I recommend buying"
      - "guaranteed returns"
      - "risk-free"
      - "you must invest"
      - "buy now"
      - "sure thing"
      - "can't lose"
      - "100% safe"
