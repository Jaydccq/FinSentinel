spring:
  application:
    name: finsentinel

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finsentinel}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: ${AI_MODEL:google/gemini-3-flash-preview}
          temperature: 0.2
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  agent:
    persona: ${APP_AGENT_PERSONA:default}
    personas-dir: classpath:prompts/personas/

  storage:
    provider: ${APP_STORAGE_PROVIDER:rustfs}
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${APP_STORAGE_BUCKET:finsentinel}
    region: ${APP_STORAGE_REGION:us-east-1}

  google-drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
    application-name: FinSentinel
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}

  firecrawl:
    api-key: ${FIRECRAWL_API_KEY:}
    base-url: https://api.firecrawl.dev/v2

  polygon:
    api-key: ${POLYGON_API_KEY}
    base-url: https://api.polygon.io

  openbb:
    enabled: ${APP_OPENBB_ENABLED:false}
    base-url: ${OPENBB_BASE_URL:http://localhost:6900}
    api-prefix: ${OPENBB_API_PREFIX:/api/v1}
    api-key: ${OPENBB_API_KEY:}
    credentials:
      bls-api-key: ${OPENBB_BLS_API_KEY:}
      congress-gov-api-key: ${OPENBB_CONGRESS_GOV_API_KEY:}
      cftc-app-token: ${OPENBB_CFTC_APP_TOKEN:}
      fred-api-key: ${OPENBB_FRED_API_KEY:}
      polygon-api-key: ${OPENBB_POLYGON_API_KEY:${POLYGON_API_KEY:}}
      us-eia-api-key: ${OPENBB_US_EIA_API_KEY:}
    business:
      macro-provider: ${OPENBB_BUSINESS_MACRO_PROVIDER:fred}
      cpi-path: ${OPENBB_BUSINESS_CPI_PATH:economy/cpi}
      unemployment-path: ${OPENBB_BUSINESS_UNEMPLOYMENT_PATH:economy/unemployment}
      fed-funds-path: ${OPENBB_BUSINESS_FED_FUNDS_PATH:economy/federal_funds_rate}
      cpi-series-id: ${OPENBB_BUSINESS_CPI_SERIES_ID:CPIAUCSL}
      unemployment-series-id: ${OPENBB_BUSINESS_UNEMPLOYMENT_SERIES_ID:UNRATE}
      fed-funds-series-id: ${OPENBB_BUSINESS_FED_FUNDS_SERIES_ID:FEDFUNDS}

  yahoo-finance:
    enabled: ${APP_YAHOO_FINANCE_ENABLED:true}
    base-url: https://query1.finance.yahoo.com

  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}

  rag:
    chunk:
      chunk-size: 500
      chunk-overlap: 50
      min-chunk-size-chars: 200
      max-num-chunks: 10000
    retrieval:
      default-top-k: 5
      similarity-threshold: 0.65
      max-top-k: 20
      query-rewrite-enabled: true
      query-rewrite-max-length: 80

  autonomy:
    heartbeat:
      enabled: ${APP_AUTONOMY_HEARTBEAT_ENABLED:true}
      dispatcher-interval-ms: ${APP_AUTONOMY_HEARTBEAT_DISPATCH_MS:30000}
      default-interval-seconds: ${APP_AUTONOMY_HEARTBEAT_DEFAULT_SECONDS:600}
      min-interval-seconds: ${APP_AUTONOMY_HEARTBEAT_MIN_SECONDS:60}
      max-interval-seconds: ${APP_AUTONOMY_HEARTBEAT_MAX_SECONDS:3600}
      default-drawdown-alert-pct: ${APP_AUTONOMY_HEARTBEAT_DRAWDOWN_PCT:10.00}

  chat:
    compaction:
      enabled: ${APP_CHAT_COMPACTION_ENABLED:true}
      threshold-messages: ${APP_CHAT_COMPACTION_THRESHOLD_MESSAGES:24}
      recent-window: ${APP_CHAT_COMPACTION_RECENT_WINDOW:10}
      max-summary-chars: ${APP_CHAT_COMPACTION_MAX_SUMMARY_CHARS:1200}

  confirmation:
    trade-amount-threshold: ${CONFIRMATION_TRADE_THRESHOLD:10000}
    block-live-mode: true

  archival:
    enabled: ${APP_ARCHIVAL_ENABLED:false}
    retention-days: ${APP_ARCHIVAL_RETENTION_DAYS:7}
    failed-retention-days: ${APP_ARCHIVAL_FAILED_RETENTION_DAYS:3}
    cron: ${APP_ARCHIVAL_CRON:0 0 2 * * *}
    batch-size: ${APP_ARCHIVAL_BATCH_SIZE:50}

  news:
    enabled: ${APP_NEWS_ENABLED:true}
    poll-interval: ${APP_NEWS_POLL_INTERVAL:60000}
    rss-poll-interval: ${APP_NEWS_RSS_POLL_INTERVAL:120000}
    watch-tickers:
      - AAPL
      - MSFT
      - GOOGL
      - TSLA
      - JPM
      - NVDA
    rss-feeds:
      - name: CNBC Top News
        url: https://www.cnbc.com/id/100003114/device/rss/rss.html
        source: RSS_CNBC
      - name: Yahoo Finance
        url: https://finance.yahoo.com/news/rssindex
        source: RSS_YAHOO
      - name: BBC Business
        url: https://feeds.bbci.co.uk/news/business/rss.xml
        source: RSS_BBC
      - name: Guardian Business
        url: https://www.theguardian.com/uk/business/rss
        source: RSS_GUARDIAN
      - name: NPR Economy
        url: https://feeds.npr.org/1017/rss.xml
        source: RSS_NPR
      - name: Reuters Economy (Google News Proxy)
        url: "https://news.google.com/rss/search?q=site:reuters.com+economy&hl=en-US&gl=US&ceid=US:en"
        source: RSS_REUTERS_PROXY
    retention-days: 30
    enrich:
      enabled: ${APP_NEWS_ENRICH_ENABLED:true}
      batch-size: 5

  x:
    enabled: ${APP_X_ENABLED:false}
    bearer-token: ${X_BEARER_TOKEN:}
    base-url: https://api.x.com/2
    poll-interval: ${APP_X_POLL_INTERVAL:300000}
    max-results-per-user: ${APP_X_MAX_RESULTS:10}
    influencers:
      # Stock & Fundamental Analysis
      - BrianFeroldi
      - andrewlokenauth
      - iancassel
      - Stephanie_Link
      - AswathDamodaran
      - OnlyCFO
      # Behavioral Finance & Long-Term Investing
      - morganhousel
      - awealthofcs
      - michaelbatnick
      - robinpowell
      - ritholtz
      - DaveRamsey
      # Macro Economics & Market Strategy
      - LizAnnSonders
      - paulkrugman
      - Nouriel
      - JustinWolfers
      - bespokeinvest
      # Financial News Aggregators
      - CNBC
      - Benzinga
      - Stocktwits
      - WSJMarkets
      - nytimesbusiness
      - TheEconomist
      # Tech & Innovation Investing
      - CathieDWood
      - pmarca
      - mcuban
      - Citrini7
      # Breakout & Technical Analysis
      - BreakoutStocks
      - DavidFaberCNBC
      # FinTech & Digital Finance
      - deepakshenoy
      - salliekrawcheck
      - TheodoraLau
      - Sopnendu
      - paolosironi
      - ledaglyptis
      - ErikFossing
      # Crypto & Digital Assets
      - PlanB_100trillion
      - BitBoy_Crypto
      - pomp
      - BarrySilbert
      - PeterMcCormack
      - ThatMartiniGuy
      - AltcoinGordon
      - punk6529
      - frxresearch

  compliance:
    region: US
    disclaimer: "This is AI-generated analysis for informational purposes only. It does not constitute investment advice. Past performance does not guarantee future results. Consult a licensed financial advisor before making investment decisions."
    forbidden-phrases:
      - "you should buy"
      - "I recommend buying"
      - "guaranteed returns"
      - "risk-free"
      - "you must invest"
      - "buy now"
      - "sure thing"
      - "can't lose"
      - "100% safe"

  trading:
    default-mode: PAPER
    alpaca:
      enabled: false
      paper: true
      api-key: ${ALPACA_API_KEY:}
      secret-key: ${ALPACA_SECRET_KEY:}
    crypto:
      enabled: false
      exchange: binance
      sandbox: true
      api-key: ${CRYPTO_API_KEY:}
      secret-key: ${CRYPTO_SECRET_KEY:}
