services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: finsentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432' # host 5433 avoids collision with native Homebrew Postgres; see CLAUDE.md
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfsdata:/data
    command:
      [
        '--address',
        ':9000',
        '--console-address',
        ':9001',
        '--access-key',
        'rustfsadmin',
        '--secret-key',
        'rustfsadmin',
        '/data',
      ]
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9001/rustfs/console/index.html']
      interval: 5s
      timeout: 3s
      retries: 5

  reranker:
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    ports:
      - '8100:8100'
    environment:
      - TRANSFORMERS_CACHE=/app/.cache
    volumes:
      - reranker-cache:/app/.cache
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8100/health']
      interval: 30s
      timeout: 10s
      retries: 3

  parser:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    ports:
      - '8110:8110'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8110/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/finsentinel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      AI_MODEL: ${AI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      ENCRYPTION_AES_KEY: ${ENCRYPTION_AES_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-rustfs}
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: rustfsadmin
      STORAGE_SECRET_KEY: rustfsadmin
      STORAGE_BUCKET: ${STORAGE_BUCKET:-finsentinel}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      APP_TRADING_DEFAULT_MODE: ${APP_TRADING_DEFAULT_MODE:-PAPER}
      APP_AGENT_PERSONA: ${APP_AGENT_PERSONA:-default}
      APP_CRYPTO_NEWS_ENABLED: ${APP_CRYPTO_NEWS_ENABLED:-false}
      CRYPTO_NEWS_6551_TOKEN: ${CRYPTO_NEWS_6551_TOKEN:-}
      APP_TWITTER_6551_ENABLED: ${APP_TWITTER_6551_ENABLED:-false}
      TWITTER_6551_TOKEN: ${TWITTER_6551_TOKEN:-}
      APP_OKX_ENABLED: ${APP_OKX_ENABLED:-false}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY:-}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      OKX_SANDBOX: ${OKX_SANDBOX:-false}
      OKX_WEBSOCKET_ENABLED: ${OKX_WEBSOCKET_ENABLED:-true}
      OPENBB_ENABLED: ${OPENBB_ENABLED:-false}
      OPENBB_BASE_URL: ${OPENBB_BASE_URL:-http://host.docker.internal:6900}
      OPENBB_API_PREFIX: ${OPENBB_API_PREFIX:-/api/v1}
      RERANKER_URL: http://reranker:8100
      RERANKER_TIMEOUT_MS: ${RERANKER_TIMEOUT_MS:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_ORIGIN: http://api:3001
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      api:
        condition: service_started
    environment:
      INTERNAL_API_ORIGIN: http://api:3001
      INTERNAL_API_BASE_URL: http://api:3001

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - '9090:9090'
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - '3002:3000'
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  rustfsdata:
  reranker-cache:
