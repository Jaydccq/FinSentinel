# Wave 2 per-bucket thresholds, applied additively alongside the overall
# `minimum_metrics:` block. A report must pass BOTH the overall gate and
# every bucket gate. Bucket names match the `tags[0]` on golden entries
# and `--bucket` on the CLI. Unknown metric keys surface as UNKNOWN_KEY.
#
# Thresholds calibrated 2026-04-21 against the 100-entry codex-labelled
# golden.json (services/evaluation-runner/datasets/golden.meta.json)
# under the offline CorpusRetriever (TF-IDF). Each floor is (observed
# baseline − 0.03), rounded to 2dp, per the P1.6/P1.8 step in
# docs/exec-plans/2026-04-21-rag-quality-next-steps.md.
#
# Baseline report: reports/p1-offline-baseline-2026-04-21.json.
#
# When live-API mode is wired end-to-end (currently blocked on
# deterministic-chunk-id remapping — see tech-debt-tracker), re-capture
# baselines and update these floors to the live-API numbers.
api_base_url: "http://localhost:3001"
retrieval:
  endpoint: "/api/rag/search"
  top_k: 10

# Overall floors — observed 2026-04-21 (offline CorpusRetriever):
#   strict.recall@5      = 0.8583
#   strict.recall@10     = 0.9517
#   lenient.recall@10    = 0.9517
#   strict.mrr@10        = 0.8175
minimum_metrics:
  strict.recall@5: 0.82
  strict.recall@10: 0.92
  lenient.recall@10: 0.92
  strict.mrr@10: 0.78

# Per-bucket floors = observed − 0.03 from reports/p1-offline-baseline-2026-04-21.json.
bucket_minimum_metrics:
  exact_lookup:
    strict.recall@5: 0.77       # baseline 0.8000
    strict.recall@10: 0.92      # baseline 0.9500
    strict.mrr@10: 0.60         # baseline 0.6368
  factoid:
    strict.recall@5: 0.90       # baseline 0.9333
    strict.recall@10: 0.97      # baseline 1.0000
    strict.mrr@10: 0.84         # baseline 0.8778
  relational:
    strict.recall@5: 0.85       # baseline 0.8889
    strict.recall@10: 0.92      # baseline 0.9583
    strict.mrr@10: 0.92         # baseline 0.9583
  analytical:
    strict.recall@5: 0.60       # baseline 0.6333
    strict.recall@10: 0.78      # baseline 0.8167
    strict.mrr@10: 0.75         # baseline 0.7833
  multi_part:
    strict.recall@5: 0.97       # baseline 1.0000
    strict.recall@10: 0.97      # baseline 1.0000
    strict.mrr@10: 0.82         # baseline 0.8542
  long_doc:
    strict.recall@5: 0.83       # baseline 0.8667
    strict.recall@10: 0.92      # baseline 0.9500
    strict.mrr@10: 0.87         # baseline 0.9000
  cross_document:
    strict.recall@5: 0.83       # baseline 0.8667
    strict.recall@10: 0.92      # baseline 0.9500
    strict.mrr@10: 0.92         # baseline 0.9500
  table_numeric:
    strict.recall@5: 0.87       # baseline 0.9000
    strict.recall@10: 0.97      # baseline 1.0000
    strict.mrr@10: 0.73         # baseline 0.7643
  colloquial:
    strict.recall@5: 0.87       # baseline 0.9000
    strict.recall@10: 0.87      # baseline 0.9000
    strict.mrr@10: 0.67         # baseline 0.7067
